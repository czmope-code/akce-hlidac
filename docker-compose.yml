services:
  web:
    build: .
    ports:
      - "8050:8050"
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-Nevim1234*}@db:5432/akce
      SECRET_KEY: ${SECRET_KEY:-Nevim1234*}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Nevim1234*}
      TZ: Europe/Prague
      RETENTION_DAYS: "30"
      SCRAPE_HOURS: "7,17"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Nevim1234*}
      POSTGRES_DB: akce
      TZ: Europe/Prague
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d akce"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
